# =====================================================================
# PRISM - Monitoramento de Impressoras
# Configuração principal da aplicação
# =====================================================================

spring.application.name=prism-monitor
server.port=${SERVER_PORT:8080}

# ---------------------------------------------------------------------
# PostgreSQL (valores via variáveis de ambiente, com padrão local)
# ---------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/prism_db}
spring.datasource.username=${DB_USER:prism}
spring.datasource.password=${DB_PASSWORD:prism}
spring.datasource.hikari.maximum-pool-size=10

# update: cria/ajusta tabelas automaticamente (bom para o protótipo).
# Em produção, prefira "validate" e migrações com Flyway.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# ---------------------------------------------------------------------
# Jackson (JSON): datas em ISO e sem campos nulos na resposta
# ---------------------------------------------------------------------
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.default-property-inclusion=non_null

# ---------------------------------------------------------------------
# Lista de equipamentos (planilha de origem)
# Na primeira execução, se a tabela estiver vazia, a planilha é importada.
# ---------------------------------------------------------------------
prism.importacao.planilha=${PLANILHA_PATH:./ativos.xlsx}
prism.importacao.habilitada=true

# ---------------------------------------------------------------------
# Coleta e ping
# ---------------------------------------------------------------------
# Intervalo entre coletas automáticas (ms). 120000 = 2 minutos
prism.coleta.intervalo-ms=${COLETA_INTERVALO_MS:120000}
# Quantidade de threads usadas para pingar equipamentos em paralelo
prism.coleta.threads=${COLETA_THREADS:20}
# Tempo máximo de espera por resposta de cada ping (ms)
prism.coleta.ping-timeout-ms=${PING_TIMEOUT_MS:1500}

# ---------------------------------------------------------------------
# Credenciais do Web Image Monitor (Ricoh)
# Nunca deixe senhas fixas no código. Defina estas variáveis no ambiente.
# ---------------------------------------------------------------------
prism.impressoras.usuario=${IMP_USUARIO:admin}
prism.impressoras.senha=${IMP_SENHA:}
# Aceita certificados HTTPS autoassinados das impressoras (rede interna)
prism.impressoras.ignorar-ssl=${IMP_IGNORAR_SSL:true}

# ---------------------------------------------------------------------
# Logs
# ---------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.prism=DEBUG
logging.pattern.console=%d{HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n
